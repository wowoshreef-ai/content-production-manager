<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>مدير إنتاج المحتوى</title>
  <meta name="theme-color" content="#03132c">
  <meta name="color-scheme" content="dark">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <div class="brand-mark">OS</div>
      <div><h1>مدير إنتاج المحتوى</h1><p class="sub" id="subtitle">مساحة عمل القنوات</p></div>
    </div>
    <div class="header-week-switch">
      <button class="header-week-arrow" data-act="header-week-prev" type="button" aria-label="الأسبوع السابق">‹</button>
      <span class="header-week-icon">▣</span><strong id="headerWeekLabel">الأسبوع الحالي</strong>
      <button class="header-week-arrow" data-act="header-week-next" type="button" aria-label="الأسبوع التالي">›</button>
    </div>
    <div class="top-actions">
      <span class="status" id="status"><i class="dot"></i><span id="statusText">متصل ومحفوظ تلقائيًا</span></span>
      <span class="save-state" id="saveState" aria-live="polite"></span>
      <button class="icon-btn" id="btnNotify" data-act="notify" type="button" aria-label="الإشعارات" title="الإشعارات">🔔</button>
      <button class="icon-btn" data-act="settings" type="button" aria-label="الإعدادات" title="الإعدادات">⚙</button>
    </div>
  </header>
  <nav class="main-nav" id="pageNav" aria-label="التنقل الرئيسي">
    <a href="#/today" data-route="today">📌 النهارده</a>
    <a href="#/week" data-route="week">🗓️ الأسبوع</a>
    <a href="#/history" data-route="history">📊 السجل والتحليلات</a>
    <a href="#/scripts" data-route="scripts">✍️ السكريبتات</a>
  </nav>

  <main>
    <div id="demoBanner" class="banner" hidden>
      <span>⚠️ البيانات الحالية <b>تجريبية</b> — عدّل القنوات وقائمة المهام من ⚙️ الإعدادات.</span>
      <button class="btn small ghost" data-act="dismiss-demo" type="button">تمام</button>
    </div>

    <section class="card progress" id="progress" aria-label="إنجاز الأسبوع"></section>

    <section id="view" aria-live="polite"></section>
  </main>

  <div id="modalRoot"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <footer class="site-footer"><span>Creator OS · نظام تشغيل وإدارة إنتاج المحتوى</span><span>بياناتك محفوظة على السيرفر</span></footer>

  <script type="module" src="/app.js"></script>
</body>
</html>
