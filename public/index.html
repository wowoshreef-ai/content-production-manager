<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>مدير إنتاج المحتوى</title>
  <meta name="theme-color" content="#16191f">
  <meta name="color-scheme" content="dark">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1>مدير إنتاج المحتوى</h1>
      <p class="sub" id="subtitle">كل قنواتك في مكان واحد</p>
    </div>
    <div class="top-actions">
      <span class="save-state" id="saveState" aria-live="polite"></span>
      <a class="btn ghost" id="navLink" href="#/scripts">✍️ السكريبتات</a>
      <button class="btn ghost" id="btnNotify" data-act="notify" type="button">🔔 الإشعارات</button>
      <button class="btn ghost" data-act="settings" type="button">⚙️ الإعدادات</button>
    </div>
  </header>

  <main>
    <div id="demoBanner" class="banner" hidden>
      <span>⚠️ البيانات الحالية <b>تجريبية</b> — عدّل القنوات وقائمة المهام من ⚙️ الإعدادات.</span>
      <button class="btn small ghost" data-act="dismiss-demo" type="button">تمام</button>
    </div>

    <section class="card progress" id="progress" aria-label="إنجاز الأسبوع"></section>

    <section id="view" aria-live="polite"></section>
  </main>

  <div id="modalRoot"></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="/app.js" defer></script>
</body>
</html>
