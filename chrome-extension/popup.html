<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>مدير إنتاج المحتوى</title>
  <style>
    :root{color-scheme:dark;font-family:"Cairo","Segoe UI",Tahoma,sans-serif;background:#0d1020;color:#e8eaf3}
    *{box-sizing:border-box}
    body{width:320px;margin:0;padding:22px;background:linear-gradient(145deg,#111527,#0d1020)}
    .brand{display:flex;align-items:center;gap:12px;margin-bottom:20px}
    .mark{width:46px;height:46px;display:grid;place-items:center;border:1px solid #303650;border-radius:14px;background:#161a2c;color:#bac5ff;font-weight:800;font-size:16px;letter-spacing:-1px}
    h1{font-size:16px;margin:0 0 3px;font-weight:750}
    p{font-size:12px;color:#a9adc0;margin:0;line-height:1.7}
    a{display:flex;justify-content:center;align-items:center;min-height:44px;padding:10px 14px;border-radius:12px;background:#8c9deb;color:#101427;text-decoration:none;font-weight:750;font-size:14px;transition:filter .16s ease,transform .16s ease}
    a:hover{filter:brightness(1.08);transform:translateY(-1px)}
    a:focus-visible{outline:3px solid #bac5ff;outline-offset:3px}
    .hint{text-align:center;margin-top:12px;font-size:11px;color:#a9adc0}
  </style>
</head>
<body>
  <header class="brand">
    <div class="mark" aria-hidden="true">OS</div>
    <div><h1>مدير إنتاج المحتوى</h1><p>القيادي · رائج · عرب جيمرز · سائح</p></div>
  </header>
  <a href="https://sharif-gc4c.onrender.com/#/today" target="_blank" rel="noopener noreferrer">فتح لوحة الإنتاج</a>
  <p class="hint">سيفتح الموقع في علامة تبويب جديدة</p>
</body>
</html>
